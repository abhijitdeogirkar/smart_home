<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>अभिप्राजामेयार्णव स्मार्ट होम</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <header>
        <h1>अभिप्राजामेयार्णव स्मार्ट होम</h1>
    </header>

    <main class="dashboard-container">
        <div class="card">
            <h2>💧 पाण्याची टाकी</h2>
            <div class="data-display" id="waterLevel">८०%</div>
            <p>स्थिती: <span id="motorStatus">बंद</span></p>
            <button id="motorToggleBtn" class="btn">मोटर सुरू करा</button>
        </div>

        <div class="card">
            <h2>☀️ सोलर जनरेशन</h2>
            <p>आजची ऊर्जा:</p>
            <div class="data-display" id="solarUnits">-- kWh</div>
        </div>

        <div class="card">
            <h2>📅 आजचे पंचांग</h2>
            <p id="panchangTithi">माहिती लोड होत आहे...</p>
        </div>

        <div class="card">
            <h2>📷 सीसीटीव्ही (CCTV)</h2>
            <div class="cctv-placeholder">
                <p>कॅमेरा फीड येथे दिसेल</p>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
