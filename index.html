<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>अभिप्राजामेयार्णव स्मार्ट होम</title>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #f4f7f6; color: #333; }
        header { background-color: #2c3e50; color: white; text-align: center; padding: 1.5rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .dashboard-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background-color: white; border-radius: 12px; padding: 20px; text-align: center; box-shadow: 0 4px 8px rgba(0,0,0,0.05); }
        .card h2 { font-size: 1.2rem; color: #2980b9; margin-bottom: 15px; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; }
        
        /* --- १. पाण्याची टाकी ॲनिमेशन (Water Tank CSS) --- */
        .tank-container {
            width: 120px;
            height: 180px;
            border: 4px solid #34495e;
            border-radius: 10px 10px 10px 10px;
            margin: 20px auto;
            position: relative;
            background-color: #ecf0f1;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
        }
        
        /* पाण्याला वर-खाली करण्यासाठी (Transition Effect) */
        .water-fill {
            position: absolute;
            bottom: 0;
            width: 100%;
            /* पाण्याची पातळी इथे सेट होते. जावास्क्रिप्टने हे बदलल्यावर ॲनिमेशन दिसेल */
            height: 80%; 
            background: linear-gradient(to bottom, #3498db, #2980b9);
            transition: height 1.5s ease-in-out;
            box-shadow: 0 -5px 15px rgba(52, 152, 219, 0.7);
        }

        .water-level-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.8rem;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
            z-index: 2;
        }

        .btn { background-color: #e74c3c; color: white; border: none; padding: 12px 20px; font-size: 1rem; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 15px; }

        /* --- २. सोलर एनर्जी ॲनिमेशन (Solar CSS) --- */
        .solar-icon {
            font-size: 5rem;
            margin: 10px 0;
            display: inline-block;
            /* सूर्य फिरण्याचा आणि चमकण्याचा इफेक्ट */
            animation: spinSun 12s linear infinite, glowSun 2s alternate infinite;
        }
        
        @keyframes spinSun {
            100% { transform: rotate(360deg); }
        }
        @keyframes glowSun {
            0% { text-shadow: 0 0 10px #f1c40f; color: #f1c40f; }
            100% { text-shadow: 0 0 30px #e67e22, 0 0 50px #e74c3c; color: #f39c12; }
        }

        .solar-text { font-size: 2.2rem; font-weight: bold; color: #d35400; margin-top: 10px; }

        .cctv-placeholder { background-color: #ecf0f1; height: 150px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #7f8c8d; margin-top: 10px; }
    </style>
</head>
<body>
    <header>
        <h1>अभिप्राजामेयार्णव स्मार्ट होम</h1>
    </header>
    <main class="dashboard-container">
        
        <div class="card">
            <h2>💧 पाण्याची टाकी</h2>
            
            <div class="tank-container">
                <div class="water-fill" id="waterFillDiv" style="height: 80%;"></div>
                <div class="water-level-text" id="waterLevel">80%</div>
            </div>
            
            <p>स्थिती: <span id="motorStatus">बंद</span></p>
            <button id="motorToggleBtn" class="btn">मोटर सुरू करा</button>
        </div>

        <div class="card">
            <h2>☀️ सोलर जनरेशन</h2>
            
            <div class="solar-icon">☀️</div>
            
            <p>आजची ऊर्जा:</p>
            <div class="solar-text" id="solarUnits">-- kWh</div>
        </div>

        <div class="card">
            <h2>📅 आजचे पंचांग</h2>
            <p id="panchangTithi">माहिती लोड होत आहे...</p>
        </div>

        <div class="card">
            <h2>📷 सीसीटीव्ही (CCTV)</h2>
            <div class="cctv-placeholder"><p>कॅमेरा फीड येथे दिसेल</p></div>
        </div>

    </main>
</body>
</html>
